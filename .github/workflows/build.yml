name: build

# 一条命令出两个平台的包：
#   Mac 包只是「根目录源码 + 启动.command」的拷贝，不需要编译，
#   所以不必开 macOS runner（它按 10 倍计费）—— 在 Windows runner 上
#   跑一次 build.py，就能同时产出 Windows/（exe）与 Mac/（源码）。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 打 tag 时发 Release 要用

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包（编译三个 exe + 归位源码 + 打 zip）
        shell: bash
        run: python build.py

      - name: 自检：包结构 + exe 能起来
        run: python tests/test_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: Codex会话监控工具
          path: Codex会话监控工具.zip

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Codex会话监控工具.zip" --generate-notes
